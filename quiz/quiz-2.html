<body>
    <div class="quiz-container">
        <div id="intro" class="intro">

            <p>Ответьте на 7 вопросов и узнайте,<br>как вы воспринимаете и изучаете реальность</p>

                <div class="options" id="options"></div>

    <div class="video-modal-overlay" id="videoModal">

    <script>
        const questions = [
            { text: "Когда вы сталкиваетесь с новой идеей, вы:", options: ["Не обращаете внимания", "Слушаете из интереса", "Анализируете", "Хотите изучить глубже"] },
            { text: "Что вам интереснее всего изучать?", options: ["Практические навыки", "Психологию", "Философию", "Устройство мира"] },
            { text: "Как вы обычно принимаете решения?", options: ["Интуитивно", "Опираясь на эмоции", "Анализируя информацию", "Пытаясь понять систему"] },
            { text: "Когда вы читаете новую книгу, вы:", options: ["Быстро теряете интерес", "Читаете из любопытства", "Размышляете над идеями", "Хотите понять глубинный смысл"] },
            { text: "Что вызывает у вас больше всего вопросов?", options: ["События вокруг", "Поведение людей", "Смысл жизни", "Устройство реальности"] },
            { text: "Когда вы слышите сложную идею:", options: ["Кажется слишком сложной", "Интересно послушать", "Пытаетесь понять", "Хотите изучить подробнее"] },
            { text: "Что для вас важнее?", options: ["Удобство", "Эмоции", "Понимание", "Истина"] }
        ];

        const types = [
            { title: "Наблюдатель", emoji: "👁", level: 1, color: "#5b7db1",
              description: "Вы воспринимаете мир через призму практичности. Глубокие вопросы пока не занимают ваше внимание, но интерес уже пробуждается.",
              cta: { text: "Посмотреть видео", icon: "play", modal: true, videoId: "DsOolQ7z3mI" } },
            { title: "Ищущий", emoji: "🔍", level: 2, color: "#667eea",
              description: "Вы чувствуете, что за поверхностью вещей скрывается нечто большее. Ваш тип познания основан на любопытстве и эмоциональном отклике.",
              cta: { text: "Посмотреть видео", icon: "play", modal: true, videoId: "1_5nEqWEsqU" } },
            { title: "Исследователь", emoji: "🧭", level: 3, color: "#8b5cf6",
              description: "Вы познаёте мир через анализ и размышление. Вам важно не просто знать, а понимать причины и связи между явлениями.",
              cta: { text: "Мини-курс", icon: "book", url: "mini-course.html" } },
            { title: "Познающий", emoji: "✨", level: 4, color: "#a855f7",
              description: "Ваш тип познания — системный и глубокий. Вы стремитесь к целостному пониманию реальности и готовы изучать её законы.",
              cta: { text: "Записаться на курс", icon: "graduation", url: "https://kabacademy.com/mak-fall-2025/step/lp-test-mir-v3/" } }
        ];

        const QUIZ_ID = 'quiz2';
        const QUIZ_LABEL = 'Тип познания мира';

        const quizMeta = [
            { id: 'quiz1', label: 'Этап поиска', url: 'index.html' },
            { id: 'quiz2', label: 'Тип познания', url: 'quiz-2.html' },
            { id: 'quiz3', label: 'Главный вопрос', url: 'quiz-3.html' },
            { id: 'quiz4', label: 'Глубина восприятия', url: 'quiz-4.html' },
            { id: 'quiz5', label: 'Готовность', url: 'quiz-5.html' }
        ];
        const soulLevels = [
            { title: 'Спящий', emoji: '💤' }, { title: 'Наблюдатель', emoji: '👁' },
            { title: 'Искатель', emoji: '🔍' }, { title: 'Путник', emoji: '🚶' },
            { title: 'Исследователь', emoji: '🧭' }, { title: 'Познающий', emoji: '✨' },
            { title: 'Проводник', emoji: '🌟' }
        ];
        const typeEmojisMap = ['👁', '🔍', '🧭', '✨'];

        function getSoulLevel(prof) {
            const done = quizMeta.filter(q => prof[q.id]);
            if (!done.length) return 0;
            const avg = done.reduce((s, q) => s + prof[q.id].dominant, 0) / done.length;
            return Math.min(6, Math.max(1, Math.round(avg * 1.2 + (done.length / quizMeta.length) * 2.5)));
        }

        function buildProfileSection() {
            const prof = JSON.parse(localStorage.getItem('quizProfile') || '{}');
            const done = quizMeta.filter(q => prof[q.id]);
            if (!done.length) return '';
            const si = getSoulLevel(prof);
            const soul = soulLevels[si];
            const pathHTML = soulLevels.map((l, i) => {
                const sc = i < si ? 's-done' : i === si ? 's-current' : 's-future';
                const dc = i < si ? 'done' : i === si ? 'current' : '';
                const line = i < soulLevels.length - 1 ? '<div class="pm-line' + (i < si ? ' done' : '') + '"></div>' : '';
                return '<div class="pm-step ' + sc + '"><div class="pm-dot ' + dc + '"></div><div class="pm-label">' + l.title + '</div></div>' + line;
            }).join('');
            const gridHTML = quizMeta.map(q => {
                const r = prof[q.id];
                if (r) return '<div class="qg-item done"><div class="qg-label">' + q.label + '</div><div class="qg-value">' + typeEmojisMap[r.dominant] + ' ' + r.title + '</div></div>';
                return '<div class="qg-item empty"><div class="qg-label">' + q.label + '</div><div class="qg-value">—</div><a class="qg-link" href="' + q.url + '">Пройти</a></div>';
            }).join('');
            const next = quizMeta.find(q => !prof[q.id]);
            const recHTML = next
                ? '<p>Пройдите тест «' + next.label + '» для углубления профиля</p><a class="btn-next" href="' + next.url + '">Следующий тест</a>'
                : '<p>Все тесты пройдены! Следующий шаг — изучение законов жизни.</p><a class="btn-next" href="https://kabacademy.com/mak-fall-2025/step/lp-test-mir-v3/" target="_blank" rel="noopener">Начать обучение</a>';
            return '<div class="profile-divider"></div><div class="profile-section"><h3>Ваш путь души</h3><div class="soul-badge"><div class="sb-emoji">' + soul.emoji + '</div><div class="sb-label">Уровень пути</div><div class="sb-title">' + soul.title + '</div></div><div class="path-mini">' + pathHTML + '</div><div class="quiz-grid">' + gridHTML + '</div><div class="rec-card">' + recHTML + '</div></div>';
        }

        let currentQuestion = 0, answers = [];

        function startQuiz() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            currentQuestion = 0; answers = [];
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('progress').style.width = ((currentQuestion / questions.length) * 100) + '%';
            document.getElementById('counter').textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
            document.getElementById('questionText').textContent = q.text;
            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.textContent = opt;
                btn.onclick = () => selectAnswer(i);
                optionsEl.appendChild(btn);
            });
            const card = document.getElementById('questionCard');
            card.style.animation = 'none'; card.offsetHeight; card.style.animation = 'slideIn 0.4s ease';
        }

        function selectAnswer(index) {
            answers.push(index);
            const btns = document.querySelectorAll('.option-btn');
            btns[index].classList.add('selected');
            btns.forEach(b => b.style.pointerEvents = 'none');
            setTimeout(() => { currentQuestion++; currentQuestion < questions.length ? showQuestion() : showResult(); }, 300);
        }

        function calculatePercentages() {
            const counts = [0,0,0,0];
            answers.forEach(a => counts[a]++);
            const total = answers.length;
            const raw = counts.map(c => (c / total) * 100);
            const floored = raw.map(v => Math.floor(v));
            let remainder = 100 - floored.reduce((a, b) => a + b, 0);
            const decimals = raw.map((v, i) => ({ i, d: v - floored[i] })).sort((a, b) => b.d - a.d);
            for (let k = 0; k < remainder; k++) floored[decimals[k].i]++;
            return floored;
        }

        function showResult() {
            document.getElementById('quiz').classList.add('hidden');
            const resultEl = document.getElementById('result');
            resultEl.classList.remove('hidden');
            const pcts = calculatePercentages();
            const sorted = pcts.map((p, i) => ({ pct: p, type: types[i], idx: i })).filter(x => x.pct > 0).sort((a, b) => b.pct - a.pct);
            const dominant = sorted[0];
            const r = dominant.type;
            const shareText = `Мой тип познания мира — ${r.title.toUpperCase()} (Уровень ${r.level})! Пройди тест и узнай свой`;
            const shareUrl = window.location.href;

            const ctaIcons = {
                play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
                book: '<svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>',
                graduation: '<svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>'
            };

            const breakdownHTML = sorted.map(s => `
                <div class="breakdown-item">
                    <div class="breakdown-label">${s.type.title}</div>
                    <div class="breakdown-bar-bg"><div class="breakdown-bar bar-color-${s.idx}" style="width: 0%" data-target="${s.pct}"></div></div>
                    <div class="breakdown-pct">${s.pct}%</div>
                </div>`).join('');

            resultEl.innerHTML = `
                <div class="result-card">
                    <div class="result-emoji">${r.emoji}</div>
                    <div class="result-level">Уровень ${r.level}</div>
                    <div class="result-title">${r.title}</div>
                    <div class="breakdown">${breakdownHTML}</div>
                    <p class="result-description">${r.description}</p>
                    ${r.cta.modal
                        ? `<button class="cta-btn" onclick="openVideoModal('${r.cta.videoId}')">${ctaIcons[r.cta.icon]} ${r.cta.text}</button>`
                        : `<a class="cta-btn" href="${r.cta.url}" target="_blank" rel="noopener">${ctaIcons[r.cta.icon]} ${r.cta.text}</a>`}
                    <p class="cta-hint">Узнайте больше о том, как устроено познание мира<br>на вводном курсе.</p>
                </div>
                <div class="share-section">
                    <h3>Поделиться результатом</h3>
                    <div class="share-buttons">
                        <a class="share-btn share-telegram" href="https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg> Telegram
                        </a>
                        <a class="share-btn share-whatsapp" href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg> WhatsApp
                        </a>
                        <a class="share-btn share-vk" href="https://vk.com/share.php?url=${encodeURIComponent(shareUrl)}&title=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M15.684 0H8.316C1.592 0 0 1.592 0 8.316v7.368C0 22.408 1.592 24 8.316 24h7.368C22.408 24 24 22.408 24 15.684V8.316C24 1.592 22.391 0 15.684 0zm3.692 17.123h-1.744c-.66 0-.864-.525-2.05-1.727-1.033-1-1.49-1.135-1.744-1.135-.356 0-.458.102-.458.593v1.575c0 .424-.135.678-1.253.678-1.846 0-3.896-1.118-5.335-3.202C4.624 10.857 4.03 8.57 4.03 8.096c0-.254.102-.491.593-.491h1.744c.44 0 .61.203.78.677.863 2.49 2.303 4.675 2.896 4.675.22 0 .322-.102.322-.66V9.721c-.068-1.186-.695-1.287-.695-1.71 0-.203.17-.407.44-.407h2.744c.373 0 .508.203.508.643v3.473c0 .372.17.508.271.508.22 0 .407-.136.813-.542 1.253-1.406 2.148-3.574 2.148-3.574.119-.254.322-.491.763-.491h1.744c.525 0 .644.27.525.643-.22 1.017-2.354 4.031-2.354 4.031-.186.305-.254.44 0 .78.186.254.796.779 1.203 1.253.745.847 1.32 1.558 1.473 2.05.17.49-.085.744-.576.744z"/></svg> ВКонтакте
                        </a>
                        <button class="share-btn share-copy" onclick="copyResult()">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Копировать
                        </button>
                    </div>
                </div>
                ${(() => {
                    const profile = JSON.parse(localStorage.getItem('quizProfile') || '{}');
                    profile[QUIZ_ID] = { label: QUIZ_LABEL, dominant: dominant.idx, title: r.title, pcts: pcts, timestamp: Date.now() };
                    localStorage.setItem('quizProfile', JSON.stringify(profile));
                    return buildProfileSection();
                })()}
                <button class="btn-restart" onclick="restart()">Пройти ещё раз</button>`;
            resultEl.dataset.shareText = shareText + '\n' + shareUrl;
            setTimeout(() => { document.querySelectorAll('.breakdown-bar').forEach(bar => { bar.style.width = bar.dataset.target + '%'; }); }, 100);
        }


        function openVideoModal(videoId) {
            document.getElementById('modalIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            document.getElementById('videoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            document.getElementById('modalIframe').src = '';
            document.getElementById('videoModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('videoModal').addEventListener('click', function(e) { if (e.target === this) closeVideoModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeVideoModal(); });

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('result').dataset.shareText).then(() => {
                const btn = document.querySelector('.share-copy');
                btn.textContent = '✓ Скопировано';
                setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Копировать'; }, 2000);
            });
        }

        function restart() {
            document.getElementById('result').classList.add('hidden');
            document.getElementById('intro').classList.remove('hidden');
        }
    </script>
</body>
</html>
