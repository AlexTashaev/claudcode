<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер-тест: на каком этапе внутреннего поиска вы находитесь</title>
    <meta property="og:title" content="Супер-тест: на каком этапе внутреннего поиска вы находитесь">
    <meta property="og:description" content="15 вопросов — и вы узнаете, какой путь познания жизни вам ближе">
    <meta property="og:type" content="website">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container { max-width: 600px; width: 100%; }

        /* Intro */
        .intro { text-align: center; animation: fadeIn 0.8s ease; }

        .intro h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .intro p {
            font-size: 1.1rem;
            color: #b0b0d0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .intro .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(102, 126, 234, 0.6);
        }

        /* Progress */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .question-counter {
            text-align: center;
            font-size: 0.85rem;
            color: #8888aa;
            margin-bottom: 12px;
        }

        /* Question */
        .question-card { animation: slideIn 0.4s ease; }

        .question-card h2 {
            font-size: 1.35rem;
            color: #fff;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e0e0e0;
            padding: 16px 20px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateX(4px);
        }

        .option-btn.selected {
            background: rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        /* Result */
        .result { text-align: center; animation: fadeIn 0.8s ease; }

        .result-card {
            background: linear-gradient(135deg, #1a1640, #2d2760);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 36px 28px;
            margin-bottom: 24px;
        }

        .result-emoji { font-size: 3.5rem; margin-bottom: 12px; }

        .result-level {
            font-size: 0.9rem;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-title {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .result-description {
            font-size: 1.05rem;
            color: #b0b0d0;
            line-height: 1.7;
            margin-bottom: 28px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Breakdown bars */
        .breakdown { margin-bottom: 28px; }

        .breakdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .breakdown-label {
            font-size: 0.85rem;
            color: #b0b0d0;
            width: 110px;
            text-align: right;
            flex-shrink: 0;
        }

        .breakdown-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .breakdown-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }

        .breakdown-pct {
            font-size: 0.85rem;
            color: #fff;
            width: 40px;
            text-align: left;
            font-weight: 600;
            flex-shrink: 0;
        }

        .bar-color-0 { background: #5b7db1; }
        .bar-color-1 { background: #667eea; }
        .bar-color-2 { background: #8b5cf6; }
        .bar-color-3 { background: #a855f7; }

        /* CTA */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 36px;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            text-decoration: none;
            margin-bottom: 12px;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(102, 126, 234, 0.6);
        }

        .cta-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .cta-hint {
            font-size: 0.9rem;
            color: #8888aa;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Generated image */
        .result-image-section { margin-bottom: 28px; }
        .result-image-section canvas { display: none; }

        .result-image-section img {
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #b0b0d0;
            padding: 10px 20px;
            font-size: 0.85rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-download:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .btn-download svg { width: 16px; height: 16px; fill: currentColor; }

        /* Share */
        .share-section h3 {
            font-size: 0.95rem;
            color: #8888aa;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #fff;
        }

        .share-btn:hover { transform: translateY(-2px); }
        .share-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .share-telegram { background: #2AABEE; }
        .share-whatsapp { background: #25D366; }
        .share-vk { background: #4C75A3; }
        .share-copy { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); }
        .share-copy:hover { background: rgba(255,255,255,0.2); }

        .btn-restart {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #b0b0d0;
            padding: 12px 32px;
            font-size: 0.95rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover { border-color: rgba(255, 255, 255, 0.4); color: #fff; }

        /* Video modal */
        .video-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .video-modal-overlay.active { display: flex; }

        .video-modal {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #1a1640;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .video-modal-close {
            position: absolute;
            top: 12px; right: 12px;
            width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.6);
            border: none; border-radius: 50%;
            color: #fff; font-size: 1.2rem;
            cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }

        .video-modal-close:hover { background: rgba(0, 0, 0, 0.8); }

        .video-modal-player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-modal-player iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .hidden { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 480px) {
            .intro h1 { font-size: 1.4rem; }
            .result-title { font-size: 1.7rem; }
            .result-card { padding: 28px 20px; }
            .share-buttons { flex-direction: column; align-items: center; }
            .share-btn { width: 220px; justify-content: center; }
            .breakdown-label { width: 90px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <!-- Intro -->
        <div id="intro" class="intro">
            <div class="badge">СУПЕР-ТЕСТ &bull; 15 ВОПРОСОВ</div>
            <h1>На каком этапе внутреннего поиска вы находитесь</h1>
            <p>Ответьте на 15 вопросов и узнайте,<br>какой путь познания жизни вам ближе</p>
            <button class="btn-start" onclick="startQuiz()">Начать тест</button>
        </div>

        <!-- Questions -->
        <div id="quiz" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question-counter" id="counter"></div>
            <div class="question-card" id="questionCard">
                <h2 id="questionText"></h2>
                <div class="options" id="options"></div>
            </div>
        </div>

        <!-- Result -->
        <div id="result" class="result hidden"></div>
    </div>

    <!-- Video modal -->
    <div class="video-modal-overlay" id="videoModal">
        <div class="video-modal">
            <button class="video-modal-close" onclick="closeVideoModal()">&times;</button>
            <div class="video-modal-player">
                <iframe id="modalIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "Что чаще всего занимает ваши мысли?",
                options: ["Стабильность жизни", "Отношения и чувства", "Смысл жизни", "Устройство мира"]
            },
            {
                text: "Когда происходит трудность, вы думаете:",
                options: ["Не повезло", "Жизнь несправедлива", "Это урок", "Есть закономерность"]
            },
            {
                text: "Что вас больше всего интересует?",
                options: ["Спокойная жизнь", "Счастье", "Смысл жизни", "Законы мироздания"]
            },
            {
                text: "Когда вы смотрите на мир, вы чаще чувствуете:",
                options: ["Интерес", "Тревогу", "Ощущение тайны", "Желание понять систему"]
            },
            {
                text: "Что вас больше всего раздражает?",
                options: ["Хаос", "Несправедливость", "Бессмысленность", "Отсутствие объяснений"]
            },
            {
                text: "Когда вы слышите слово «душа», вы думаете:",
                options: ["Религия", "Философия", "Внутренний мир", "Духовная структура"]
            },
            {
                text: "Что вы ищете в жизни?",
                options: ["Стабильность", "Счастье", "Ответы", "Понимание законов"]
            },
            {
                text: "Что для вас важнее всего?",
                options: ["Комфорт", "Отношения", "Смысл", "Истина"]
            },
            {
                text: "Когда вы сталкиваетесь с проблемой:",
                options: ["Стараетесь избежать", "Переживаете", "Пытаетесь понять причину", "Ищете закономерность"]
            },
            {
                text: "Как вы воспринимаете жизнь?",
                options: ["Цепочка событий", "Борьба", "Путь развития", "Система законов"]
            },
            {
                text: "Что чаще всего заставляет вас задумываться?",
                options: ["Новости", "Личные отношения", "Внутренние вопросы", "Устройство реальности"]
            },
            {
                text: "Когда вы думаете о будущем:",
                options: ["Хотите стабильности", "Хотите счастья", "Хотите понять смысл", "Хотите понять мир"]
            },
            {
                text: "Когда вы слышите новую идею:",
                options: ["Относитесь скептически", "Слушаете из интереса", "Анализируете", "Хотите изучить глубже"]
            },
            {
                text: "Что вызывает у вас наибольший интерес?",
                options: ["Практические знания", "Психология", "Философия", "Устройство мироздания"]
            },
            {
                text: "Какой вопрос вы задаёте чаще всего?",
                options: ["Как жить спокойнее?", "Как быть счастливым?", "Зачем мы живём?", "Как устроена реальность?"]
            }
        ];

        const types = [
            {
                title: "Наблюдатель",
                emoji: "👁",
                level: 1,
                color: "#5b7db1",
                description: "Вы воспринимаете жизнь как поток событий. Глубокие вопросы только начинают появляться. Сам факт, что вы прошли этот тест, говорит о вашей готовности к следующему шагу.",
                cta: { text: "Посмотреть видео", icon: "play", modal: true, videoId: "DsOolQ7z3mI" }
            },
            {
                title: "Ищущий",
                emoji: "🔍",
                level: 2,
                color: "#667eea",
                description: "Вы чувствуете, что жизнь устроена глубже, чем кажется. Поиск смысла становится для вас важным. Вы на пороге открытий, которые могут изменить ваше восприятие.",
                cta: { text: "Посмотреть видео", icon: "play", modal: true, videoId: "1_5nEqWEsqU" }
            },
            {
                title: "Исследователь",
                emoji: "🧭",
                level: 3,
                color: "#8b5cf6",
                description: "Вы активно ищете ответы на вопросы о жизни и человеке. Вы чувствуете, что за событиями стоят уроки и закономерности, и стремитесь их раскрыть.",
                cta: { text: "Мини-курс", icon: "book", url: "mini-course.html" }
            },
            {
                title: "Познающий",
                emoji: "✨",
                level: 4,
                color: "#a855f7",
                description: "Вы готовы изучать законы реальности и применять знания. Вы видите мир как систему и стремитесь к осознанной, глубокой жизни.",
                cta: { text: "Записаться на курс", icon: "graduation", url: "https://kabacademy.com/mak-fall-2025/step/lp-test-mir-v3/" }
            }
        ];

        let currentQuestion = 0;
        let answers = [];

        function startQuiz() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            currentQuestion = 0;
            answers = [];
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('progress').style.width = ((currentQuestion / questions.length) * 100) + '%';
            document.getElementById('counter').textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
            document.getElementById('questionText').textContent = q.text;

            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i);
                optionsEl.appendChild(btn);
            });

            const card = document.getElementById('questionCard');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'slideIn 0.4s ease';
        }

        function selectAnswer(index) {
            answers.push(index);

            const btns = document.querySelectorAll('.option-btn');
            btns[index].classList.add('selected');
            btns.forEach(b => b.style.pointerEvents = 'none');

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 300);
        }

        function calculatePercentages() {
            const counts = [0, 0, 0, 0];
            answers.forEach(a => counts[a]++);
            const total = answers.length;
            const raw = counts.map(c => (c / total) * 100);

            const floored = raw.map(v => Math.floor(v));
            let remainder = 100 - floored.reduce((a, b) => a + b, 0);
            const decimals = raw.map((v, i) => ({ i, d: v - floored[i] }));
            decimals.sort((a, b) => b.d - a.d);
            for (let k = 0; k < remainder; k++) {
                floored[decimals[k].i]++;
            }
            return floored;
        }

        function showResult() {
            document.getElementById('quiz').classList.add('hidden');
            const resultEl = document.getElementById('result');
            resultEl.classList.remove('hidden');

            const pcts = calculatePercentages();

            const sorted = pcts.map((p, i) => ({ pct: p, type: types[i], idx: i }))
                               .filter(x => x.pct > 0)
                               .sort((a, b) => b.pct - a.pct);

            const dominant = sorted[0];
            const r = dominant.type;

            const shareText = `Мой тип внутреннего поиска — ${r.title.toUpperCase()} (Уровень ${r.level})! Пройди супер-тест и узнай свой`;
            const shareUrl = window.location.href;

            const ctaIcons = {
                play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
                book: '<svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>',
                graduation: '<svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>'
            };

            const breakdownHTML = sorted.map(s => `
                <div class="breakdown-item">
                    <div class="breakdown-label">${s.type.title}</div>
                    <div class="breakdown-bar-bg">
                        <div class="breakdown-bar bar-color-${s.idx}" style="width: 0%" data-target="${s.pct}"></div>
                    </div>
                    <div class="breakdown-pct">${s.pct}%</div>
                </div>
            `).join('');

            resultEl.innerHTML = `
                <div class="result-card">
                    <div class="result-emoji">${r.emoji}</div>
                    <div class="result-level">Уровень ${r.level}</div>
                    <div class="result-title">${r.title}</div>
                    <div class="breakdown">${breakdownHTML}</div>
                    <p class="result-description">${r.description}</p>
                    ${r.cta.modal
                        ? `<button class="cta-btn" onclick="openVideoModal('${r.cta.videoId}')">
                            ${ctaIcons[r.cta.icon]}
                            ${r.cta.text}
                          </button>`
                        : `<a class="cta-btn" href="${r.cta.url}" target="_blank" rel="noopener">
                            ${ctaIcons[r.cta.icon]}
                            ${r.cta.text}
                          </a>`
                    }
                    <p class="cta-hint">Если вам откликнулся этот результат, вы можете узнать больше<br>о законах жизни на вводном курсе.</p>
                </div>
                <div class="result-image-section">
                    <canvas id="resultCanvas" width="1080" height="1080"></canvas>
                    <img id="resultImage" alt="Результат теста">
                    <br>
                    <button class="btn-download" onclick="downloadImage()">
                        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        Скачать картинку
                    </button>
                </div>
                <div class="share-section">
                    <h3>Поделиться результатом</h3>
                    <div class="share-buttons">
                        <a class="share-btn share-telegram"
                           href="https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}"
                           target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                            Telegram
                        </a>
                        <a class="share-btn share-whatsapp"
                           href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}"
                           target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                            WhatsApp
                        </a>
                        <a class="share-btn share-vk"
                           href="https://vk.com/share.php?url=${encodeURIComponent(shareUrl)}&title=${encodeURIComponent(shareText)}"
                           target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24"><path d="M15.684 0H8.316C1.592 0 0 1.592 0 8.316v7.368C0 22.408 1.592 24 8.316 24h7.368C22.408 24 24 22.408 24 15.684V8.316C24 1.592 22.391 0 15.684 0zm3.692 17.123h-1.744c-.66 0-.864-.525-2.05-1.727-1.033-1-1.49-1.135-1.744-1.135-.356 0-.458.102-.458.593v1.575c0 .424-.135.678-1.253.678-1.846 0-3.896-1.118-5.335-3.202C4.624 10.857 4.03 8.57 4.03 8.096c0-.254.102-.491.593-.491h1.744c.44 0 .61.203.78.677.863 2.49 2.303 4.675 2.896 4.675.22 0 .322-.102.322-.66V9.721c-.068-1.186-.695-1.287-.695-1.71 0-.203.17-.407.44-.407h2.744c.373 0 .508.203.508.643v3.473c0 .372.17.508.271.508.22 0 .407-.136.813-.542 1.253-1.406 2.148-3.574 2.148-3.574.119-.254.322-.491.763-.491h1.744c.525 0 .644.27.525.643-.22 1.017-2.354 4.031-2.354 4.031-.186.305-.254.44 0 .78.186.254.796.779 1.203 1.253.745.847 1.32 1.558 1.473 2.05.17.49-.085.744-.576.744z"/></svg>
                            ВКонтакте
                        </a>
                        <button class="share-btn share-copy" onclick="copyResult()">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            Копировать
                        </button>
                    </div>
                </div>
                <button class="btn-restart" onclick="restart()">Пройти ещё раз</button>
            `;

            resultEl.dataset.shareText = shareText + '\n' + shareUrl;

            // Animate bars
            setTimeout(() => {
                document.querySelectorAll('.breakdown-bar').forEach(bar => {
                    bar.style.width = bar.dataset.target + '%';
                });
            }, 100);

            // Generate image
            generateResultImage(r, sorted);
        }

        function generateResultImage(dominant, sorted) {
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            const W = 1080, H = 1080;

            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#0f0c29');
            bgGrad.addColorStop(0.5, '#302b63');
            bgGrad.addColorStop(1, '#24243e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Decorative circles
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#667eea';
            ctx.beginPath(); ctx.arc(850, 180, 200, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(200, 900, 150, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;

            // Inner card
            const cardX = 60, cardY = 60, cardW = W - 120, cardH = H - 120;
            ctx.fillStyle = 'rgba(26, 22, 64, 0.7)';
            roundRect(ctx, cardX, cardY, cardW, cardH, 30);
            ctx.fill();
            ctx.strokeStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.lineWidth = 2;
            roundRect(ctx, cardX, cardY, cardW, cardH, 30);
            ctx.stroke();

            // Badge
            ctx.fillStyle = 'rgba(102, 126, 234, 0.15)';
            const badgeW = 340, badgeH = 36, badgeX = (W - badgeW) / 2, badgeY = 110;
            roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 18);
            ctx.fill();
            ctx.fillStyle = '#667eea';
            ctx.font = '600 16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('МОЙ ТИП ВНУТРЕННЕГО ПОИСКА', W / 2, badgeY + 24);

            // Emoji
            ctx.font = '80px sans-serif';
            ctx.fillText(dominant.emoji, W / 2, 240);

            // Level
            ctx.fillStyle = '#667eea';
            ctx.font = '600 28px "Segoe UI", sans-serif';
            ctx.fillText(`УРОВЕНЬ СОЗНАНИЯ: ${dominant.level}`, W / 2, 300);

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 64px "Segoe UI", sans-serif';
            ctx.fillText(dominant.title, W / 2, 385);

            // Divider
            const divGrad = ctx.createLinearGradient(W / 2 - 100, 0, W / 2 + 100, 0);
            divGrad.addColorStop(0, 'rgba(102,126,234,0)');
            divGrad.addColorStop(0.5, 'rgba(102,126,234,0.6)');
            divGrad.addColorStop(1, 'rgba(102,126,234,0)');
            ctx.strokeStyle = divGrad;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(W / 2 - 150, 420); ctx.lineTo(W / 2 + 150, 420); ctx.stroke();

            // Bars
            const barStartY = 470;
            const barLeftX = 300;
            const barWidth = 400;
            const barHeight = 22;
            const barGap = 60;
            const barColors = ['#5b7db1', '#667eea', '#8b5cf6', '#a855f7'];

            sorted.forEach((s, i) => {
                const y = barStartY + i * barGap;

                ctx.fillStyle = '#b0b0d0';
                ctx.font = '400 24px "Segoe UI", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(s.type.title, barLeftX - 16, y + 16);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                roundRect(ctx, barLeftX, y, barWidth, barHeight, 11);
                ctx.fill();

                const fillW = (s.pct / 100) * barWidth;
                if (fillW > 0) {
                    const barGradient = ctx.createLinearGradient(barLeftX, 0, barLeftX + fillW, 0);
                    barGradient.addColorStop(0, barColors[s.idx]);
                    barGradient.addColorStop(1, barColors[s.idx] + 'cc');
                    ctx.fillStyle = barGradient;
                    roundRect(ctx, barLeftX, y, Math.max(fillW, 12), barHeight, 11);
                    ctx.fill();
                }

                ctx.fillStyle = '#ffffff';
                ctx.font = '700 26px "Segoe UI", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`${s.pct}%`, barLeftX + barWidth + 14, y + 17);
            });

            // Bottom
            const bottomY = barStartY + sorted.length * barGap + 50;
            ctx.fillStyle = '#8888aa';
            ctx.font = '400 20px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Пройдите супер-тест и узнайте свой тип', W / 2, bottomY);
            ctx.fillText('внутреннего поиска', W / 2, bottomY + 28);

            const img = document.getElementById('resultImage');
            img.src = canvas.toDataURL('image/png');
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function downloadImage() {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.download = 'мой-тип-внутреннего-поиска.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function openVideoModal(videoId) {
            const iframe = document.getElementById('modalIframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            document.getElementById('videoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            document.getElementById('modalIframe').src = '';
            document.getElementById('videoModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeVideoModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeVideoModal();
        });

        function copyResult() {
            const text = document.getElementById('result').dataset.shareText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.share-copy');
                btn.textContent = '✓ Скопировано';
                setTimeout(() => {
                    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Копировать`;
                }, 2000);
            });
        }

        function restart() {
            document.getElementById('result').classList.add('hidden');
            document.getElementById('intro').classList.remove('hidden');
        }
    </script>
</body>
